name: 极跃棋牌移动端编译（APK + 未签名 IPA）

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jiyue-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doudizhu/mobile/package-lock.json

      - name: 安装依赖
        working-directory: doudizhu/mobile
        run: npm ci

      - name: 链接依赖到 desktop 构建根
        working-directory: doudizhu
        run: |
          if [ ! -d desktop/node_modules ]; then
            ln -s ../mobile/node_modules desktop/node_modules
          fi
          ls -ld desktop/node_modules

      - name: 构建 Web 资源
        working-directory: doudizhu/mobile
        run: npm run build

      - name: 同步 Android 工程
        working-directory: doudizhu/mobile
        run: npx cap sync android

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 校验 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms" && echo "SDK platforms 就绪"

      - name: 修正 Gradle 权限
        working-directory: doudizhu/mobile
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        working-directory: doudizhu/mobile/android
        run: ./gradlew assembleDebug

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp doudizhu/mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/jiyue-qipai-android-debug.apk
          ls -lh artifacts

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: jiyue-qipai-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
