# xcodegen 配置：GitHub Actions 上生成 .xcodeproj 再交给 xcodebuild 编译
# 纯 UIKit + WebKit，无越狱依赖，产出未签名 IPA 由全能签重签安装
name: QuChuAdmin

options:
  bundleIdPrefix: com.ipashell
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGN_IDENTITY: ""
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SUPPORTED_PLATFORMS: iphoneos

targets:
  QuChuAdmin:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - sdk: WebKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "清理中心"
        CFBundleName: "QuChuAdmin"
        CFBundleIdentifier: "com.ipashell.quchu"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: "UIStatusBarStyleDefault"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_NAME: QuChuAdmin
      PRODUCT_BUNDLE_IDENTIFIER: com.ipashell.quchu
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
