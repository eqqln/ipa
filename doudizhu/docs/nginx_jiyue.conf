# 极跃棋牌 - 反向代理与静态站点配置
# 放置于 /www/server/panel/vhost/nginx/extension/game.shengka.net/jiyue.conf

# 后端 API 反向代理
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# Socket.IO WebSocket 反向代理
location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 管理后台静态资源：admin-web 的构建产物使用 /assets/ 绝对路径
location ^~ /assets/ {
    alias /www/wwwroot/game.shengka.net/admin/assets/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Web 运营管理后台（静态）
location = /admin/index.html {
    alias /www/wwwroot/game.shengka.net/admin/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ^~ /admin/ {
    alias /www/wwwroot/game.shengka.net/admin/;
    try_files $uri $uri/ /admin/index.html;
}

location = /favicon.ico {
    return 204;
    access_log off;
}

# 桌面客户端下载区
location ^~ /download/ {
    alias /www/wwwroot/game.shengka.net/download/;
    autoindex on;
}

# 根路径：下载引导页
location = / {
    root /www/wwwroot/game.shengka.net;
    try_files /index.html @fallback;
}
location @fallback {
    default_type text/html;
    return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>极跃棋牌</title></head><body style="font-family:sans-serif;text-align:center;padding:60px"><h1>极跃棋牌 · 企业级运营系统</h1><p><a href="/admin/">Web 管理后台</a></p><p><a href="/download/">桌面客户端下载</a></p></body></html>';
}
